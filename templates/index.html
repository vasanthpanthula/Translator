<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Translator</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="container">


    <div class="translator">


        <div class="header">

            <h1>
                🌐 Translator
            </h1>

            <p>
                Translate your text easily
            </p>

        </div>


        <!-- LANGUAGE -->

        <div class="row">

            <div class="col-md-6">

                <label>From</label>

                <select
                    id="source"
                    class="form-select"
                >

                    {% for name, code in languages.items() %}

                    <option
                        value="{{ code }}"
                        {% if code == "en" %}
                        selected
                        {% endif %}
                    >

                        {{ name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="col-md-6">

                <label>To</label>

                <select
                    id="target"
                    class="form-select"
                >

                    {% for name, code in languages.items() %}

                    <option
                        value="{{ code }}"
                        {% if code == "te" %}
                        selected
                        {% endif %}
                    >

                        {{ name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <!-- INPUT -->

        <div class="text-section">

            <label>
                Your Text
            </label>

            <textarea
                id="inputText"
                class="form-control"
                placeholder="Type or speak something..."
            ></textarea>

        </div>


        <!-- INPUT BUTTONS -->

        <div class="buttons">

            <button
                id="micBtn"
                class="btn btn-outline-primary"
                type="button"
            >
                🎤 Speak
            </button>


            <button
                id="translateBtn"
                class="btn btn-primary"
                type="button"
            >
                Translate
            </button>


            <button
                id="clearBtn"
                class="btn btn-outline-secondary"
                type="button"
            >
                Clear
            </button>

        </div>


        <div id="micStatus"></div>


        <!-- OUTPUT -->

        <div class="text-section">

            <label>
                Translation
            </label>


            <div
                id="outputText"
                class="output"
            >

                Your translation will appear here.

            </div>

        </div>


        <!-- SPEECH -->

        <div class="buttons">

            <button
                id="speakBtn"
                class="btn btn-success"
                type="button"
            >
                🔊 Speak Translation
            </button>


       

        </div>


        <div id="message"></div>


        <!-- HIDDEN AUDIO -->

        <audio
            id="audioPlayer"
            controls
            class="audio-player"
        ></audio>


    </div>

</div>


<script>


// =====================================
// ELEMENTS
// =====================================

const inputText =
    document.getElementById("inputText");

const outputText =
    document.getElementById("outputText");

const source =
    document.getElementById("source");

const target =
    document.getElementById("target");

const micStatus =
    document.getElementById("micStatus");

const message =
    document.getElementById("message");

const audioPlayer =
    document.getElementById("audioPlayer");


// =====================================
// MESSAGE
// =====================================

function showMessage(text, type) {

    message.innerHTML =
        `
        <div class="alert alert-${type} mt-3">
            ${text}
        </div>
        `;

}


// =====================================
// TRANSLATE
// =====================================

document
.getElementById("translateBtn")
.addEventListener("click", async function () {


    const text =
        inputText.value.trim();


    if (!text) {

        showMessage(
            "Please enter some text.",
            "warning"
        );

        return;

    }


    outputText.textContent =
        "Translating...";


    try {

        const response =
            await fetch(
                "/translate",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            text: text,

                            source:
                                source.value,

                            target:
                                target.value

                        })

                }
            );


        const data =
            await response.json();


        if (data.success) {

            outputText.textContent =
                data.translation;


            showMessage(
                "Translation successful.",
                "success"
            );

        }

        else {

            outputText.textContent =
                "Translation unavailable.";

            showMessage(
                data.message,
                "danger"
            );

        }


    }

    catch (error) {

        console.error(error);

        outputText.textContent =
            "Translation unavailable.";

        showMessage(
            "Unable to connect to the server.",
            "danger"
        );

    }

});


// =====================================
// VOICE INPUT
// =====================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {


    const recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    const speechLanguages = {

        en: "en-IN",

        te: "te-IN",

        hi: "hi-IN",

        ta: "ta-IN",

        kn: "kn-IN",

        mr: "mr-IN"

    };


    document
    .getElementById("micBtn")
    .addEventListener(
        "click",
        function () {


            recognition.lang =
                speechLanguages[
                    source.value
                ] || "en-IN";


            micStatus.textContent =
                "🎤 Listening...";


            try {

                recognition.start();

            }

            catch (error) {

                console.log(error);

            }

        }
    );


    recognition.onresult =
        function (event) {


            let text =
                event
                .results[0][0]
                .transcript
                .trim();


            // Automatically add period

            if (
                text &&
                !/[.!?,;:]$/.test(text)
            ) {

                text += ".";

            }


            inputText.value =
                text;


            micStatus.textContent =
                "✅ Voice captured successfully.";

        };


    recognition.onerror =
        function (event) {

            micStatus.textContent =
                "❌ Microphone error: " +
                event.error;

        };


}
else {

    document
    .getElementById("micBtn")
    .disabled = true;

    micStatus.textContent =
        "Voice input is not supported.";

}


// =====================================
// SPEAK TRANSLATION
// =====================================

document
.getElementById("speakBtn")
.addEventListener(
    "click",
    async function () {


        const text =
            outputText.textContent.trim();


        if (
            !text ||
            text ===
            "Your translation will appear here." ||
            text ===
            "Translation unavailable." ||
            text ===
            "Translating..."
        ) {

            showMessage(
                "Please translate some text first.",
                "warning"
            );

            return;

        }


        showMessage(
            "🔊 Creating speech...",
            "info"
        );


        try {


            const response =
                await fetch(
                    "/speak",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                text: text,

                                language:
                                    target.value

                            })

                    }
                );


            if (!response.ok) {

                const error =
                    await response.json();

                showMessage(
                    error.message ||
                    "Speech failed.",
                    "danger"
                );

                return;

            }


            const audioBlob =
                await response.blob();


            const audioUrl =
                URL.createObjectURL(
                    audioBlob
                );


            // Stop previous audio

            audioPlayer.pause();


            audioPlayer.currentTime = 0;


            // Set new audio

            audioPlayer.src =
                audioUrl;


            // Play audio

            await audioPlayer.play();


            showMessage(
                "🔊 Speaking translation...",
                "success"
            );


        }

        catch (error) {

            console.error(error);


            showMessage(
                "Unable to play the translation audio.",
                "danger"
            );

        }

    }
);


// =====================================
// STOP
// =====================================

document
.getElementById("stopBtn")
.addEventListener(
    "click",
    function () {


        audioPlayer.pause();


        audioPlayer.currentTime =
            0;


        showMessage(
            "⏹ Speech stopped.",
            "warning"
        );

    }
);


// =====================================
// COPY
// =====================================

document
.getElementById("copyBtn")
.addEventListener(
    "click",
    async function () {


        const text =
            outputText.textContent.trim();


        if (
            !text ||
            text ===
            "Your translation will appear here."
        ) {

            showMessage(
                "Nothing to copy.",
                "warning"
            );

            return;

        }


        try {

            await navigator
                .clipboard
                .writeText(text);


            showMessage(
                "📋 Translation copied.",
                "success"
            );

        }

        catch (error) {

            showMessage(
                "Unable to copy.",
                "danger"
            );

        }

    }
);


// =====================================
// CLEAR
// =====================================

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    function () {


        inputText.value = "";


        outputText.textContent =
            "Your translation will appear here.";


        micStatus.textContent = "";


        message.innerHTML = "";


        audioPlayer.pause();


        audioPlayer.src = "";


    }
);


</script>


</body>

</html>
